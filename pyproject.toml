[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fact-knowledge-layer"
version = "0.1.0"
description = "A grounded fact knowledge layer for PDF collections"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.8,<3",
    "pymupdf>=1.24,<2",
    "python-multipart>=0.0.9,<1",
    "google-genai>=1.0,<2",
    "groq>=0.9,<1",
    "sentence-transformers>=3,<6",
    "faiss-cpu>=1.8,<2",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]